# Dependabot revisa cada semana si hay versiones nuevas (o con
# vulnerabilidades conocidas) y abre un Pull Request solo.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
