name: CodeQL

# Análisis estático de seguridad de GitHub: busca vulnerabilidades en el
# código (inyección SQL, XSS, deserialización insegura, etc.)
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * 1' # todos los lunes

permissions:
  contents: read
  security-events: write

jobs:
  analizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: none

      - uses: github/codeql-action/analyze@v3
