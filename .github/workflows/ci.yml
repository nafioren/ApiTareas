name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimos permisos necesarios (buena práctica de seguridad)
permissions:
  contents: read

jobs:
  build:
    name: Compilar y testear
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y correr tests
        run: mvn -B verify

  integracion:
    name: Prueba de punta a punta (WildFly + MySQL)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Levantar la app con Docker Compose
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Probar la API
        run: ./scripts/prueba-humo.sh

      - name: Logs si algo falló
        if: failure()
        run: docker compose logs

      - name: Apagar
        if: always()
        run: docker compose down -v
